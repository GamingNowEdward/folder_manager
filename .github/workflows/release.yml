name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify version consistency
        run: node scripts/check-version.mjs "${{ github.ref_name }}"

  release:
    needs: verify
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - name: Extract release notes from CHANGELOG
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $content = Get-Content docs/CHANGELOG.md -Raw
          $pattern = "(?ms)^## \[$([regex]::Escape($version))\][^\n]*\n(.*?)(?=^## \[|\z)"
          $match = [regex]::Match($content, $pattern)
          if (-not $match.Success) { throw "CHANGELOG 中未找到版本 $version 的条目" }
          $match.Groups[1].Value.Trim() | Out-File -FilePath release-notes.md -Encoding utf8
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Folder Manager __VERSION__'
          releaseDraft: true
          prerelease: false
      - name: Apply release notes
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${{ github.ref_name }}" --notes-file release-notes.md
      - name: Package and upload portable zip
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $name = "FolderManager_${version}_portable"
          New-Item -ItemType Directory -Path $name -Force | Out-Null
          Copy-Item "src-tauri/target/release/folder-manager.exe" "$name/" -Force
          $readme = @(
            "Folder Manager $version (portable)",
            "",
            "直接运行 folder-manager.exe 即可，无需安装。",
            "config.json 与 settings.json 会生成在 exe 同目录，便于便携使用。",
            "请放在有写入权限的目录（不要放进 Program Files）。",
            ""
          ) -join "`r`n"
          Set-Content -Path "$name/README.txt" -Value $readme -Encoding UTF8
          Compress-Archive -Path "$name/*" -DestinationPath "$name.zip" -Force
          gh release upload "${{ github.ref_name }}" "$name.zip" --clobber
